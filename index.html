<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Flashcards - Accueil</title>
	<style>
		:root {
			--ink: #24313b;
			--muted: #6d7a83;
			--paper: #f6f7f4;
			--card: #ffffff;
			--line: #dfe5e1;
			--accent: #e76f51;
			--accent-dark: #bc4f37;
			--yellow: #f8e6a8;
			--blue: #dcecf5;
			--shadow: 0 14px 30px rgba(44, 62, 70, 0.08);
		}

		* { box-sizing: border-box; }
		body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; color: var(--ink); background: var(--paper); font-family: Georgia, "Times New Roman", serif; }
		.home { width: min(680px, 100%); padding: clamp(42px, 8vw, 90px) clamp(28px, 7vw, 76px); border: 1px solid var(--line); border-radius: 16px; background: var(--card); box-shadow: var(--shadow); text-align: center; }
		.brand-mark { position: relative; display: grid; width: 42px; height: 38px; margin: 0 auto 28px; place-items: center; }
		.brand-mark::before, .brand-mark::after { position: absolute; width: 27px; height: 29px; border: 2px solid var(--ink); border-radius: 5px; content: ""; }
		.brand-mark::before { background: var(--yellow); transform: translate(-5px, 4px) rotate(-10deg); }
		.brand-mark::after { background: var(--blue); transform: translate(5px, 1px) rotate(8deg); }
		.brand-mark span { position: relative; z-index: 1; display: grid; width: 27px; height: 29px; place-items: center; color: #fff; background: var(--accent); border: 2px solid var(--ink); border-radius: 5px; font-family: Arial, sans-serif; font-size: 0.9rem; font-weight: 800; }
		.eyebrow { margin: 0 0 12px; color: var(--accent-dark); font-family: Arial, sans-serif; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; }
		h1 { margin: 0; font-size: clamp(3.8rem, 12vw, 7rem); font-weight: 400; line-height: 0.95; letter-spacing: -0.04em; }
		.description { max-width: 420px; margin: 24px auto 32px; color: var(--muted); font-family: Arial, sans-serif; line-height: 1.6; }
		.start-button { display: inline-block; padding: 14px 22px; border-radius: 8px; color: #fff; background: var(--accent); font-family: Arial, sans-serif; font-size: 0.9rem; font-weight: 700; text-decoration: none; transition: transform 160ms ease, background 160ms ease; }
		.start-button:hover, .start-button:focus-visible { background: var(--accent-dark); transform: translateY(-2px); }
	</style>
</head>
<body>
	<main class="home">
		<div class="brand-mark" aria-hidden="true"><span>F</span></div>
		<p class="eyebrow">Espace de révision</p>
		<h1>Flashcards</h1>
		<p class="description">Réviser ses leçons avec un site bien shlag</p>
		<a class="start-button" href="page 1.html">Commencer les révisions</a>
	</main>
</body>
</html>
